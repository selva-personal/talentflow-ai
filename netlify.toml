# Monorepo Netlify config — must live at repository root.
# Netlify ignores frontend/talentflow-web/netlify.toml unless the UI base directory matches.
# Docs: docs/deployment/NETLIFY.md

[build]
  base = "frontend/talentflow-web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: serve index.html for client-side routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
