spring:
  application:
    name: talentflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentflow}
    username: ${SPRING_DATASOURCE_USERNAME:talentflow}
    password: ${SPRING_DATASOURCE_PASSWORD:talentflow_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

talentflow:
  jwt:
    secret: ${JWT_SECRET:TalentFlowDevSecretKeyChangeInProductionMinimum32Chars}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  # Comma-separated list: local Vite + Netlify production URL(s)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash
  ai:
    mode: ${APP_AI_MODE:gemini}
    provider: ${AI_PROVIDER:gemini}
  upload:
    directory: ${FILE_UPLOAD_DIR:./uploads}
  rate-limit:
    requests-per-minute: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.talentflow: DEBUG
    org.springframework.security: INFO
