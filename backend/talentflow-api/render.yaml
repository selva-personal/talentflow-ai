# TalentFlow API — Render Blueprint (optional)
# Docs: docs/deployment/RENDER.md
# Set CORS_ALLOWED_ORIGINS to: http://localhost:5173,https://YOUR_NETLIFY_DOMAIN.netlify.app

services:
  - type: web
    name: talentflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_MS
        value: "900000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FILE_UPLOAD_DIR
        value: ./uploads
      - key: PORT
        value: "8080"
