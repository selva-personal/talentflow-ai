# TalentFlow AI — Netlify deployment (frontend)
# Docs: docs/deployment/NETLIFY.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: serve index.html for client-side routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
